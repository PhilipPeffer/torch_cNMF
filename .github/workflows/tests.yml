name: Tests

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra torch --extra test

      - name: Verify torchnmf import
        run: uv run python -c "import torchnmf; import torch; print('torch:', torch.__version__, '| torchnmf:', torchnmf.__version__)"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=long
